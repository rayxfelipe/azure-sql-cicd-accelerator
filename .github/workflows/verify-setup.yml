name: Verify accelerator setup
run-name: Setup verification ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique correlation ID generated by guided setup
        required: true
        type: string

permissions:
  contents: read

jobs:
  oidc:
    name: OIDC (${{ matrix.environment }})
    if: github.ref == 'refs/heads/main' && vars.SETUP_IN_PROGRESS == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, production]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify actual subject without printing the token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SUBJECT: ${{ vars.EXPECTED_OIDC_SUBJECT }}
        with:
          script: |
            const token = await core.getIDToken('api://AzureADTokenExchange');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            if (!process.env.EXPECTED_SUBJECT || claims.sub !== process.env.EXPECTED_SUBJECT ||
                claims.repository_id !== context.payload.repository.id.toString() ||
                claims.ref !== 'refs/heads/main' || claims.aud !== 'api://AzureADTokenExchange' ||
                claims.iss !== 'https://token.actions.githubusercontent.com') {
              throw new Error('Emitted OIDC claims do not match this repository and environment. Setup remains disabled.');
            }
            await core.summary.addRaw(`Verified repository-specific OIDC subject: ${claims.sub}`).write();
  package:
    if: github.ref == 'refs/heads/main' && vars.SETUP_IN_PROGRESS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-tools
          path: |
            scripts/Common.ps1
            scripts/Invoke-DatabaseSql.ps1
            scripts/Test-Readiness.ps1
            tests/Readiness.sql
          retention-days: 1
          if-no-files-found: error
  sql:
    name: SQL (${{ matrix.environment }})
    needs: [oidc, package]
    runs-on: [self-hosted, linux, x64, "${{ vars.RUNNER_LABEL }}"]
    environment: ${{ matrix.environment }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, production]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readiness-tools
          path: package
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify private connectivity and contained-user grants
        shell: pwsh
        env:
          SQL_SERVER_FQDN: ${{ vars.SQL_SERVER_FQDN }}
          SQL_DATABASE_NAME: ${{ vars.SQL_DATABASE_NAME }}
          SQL_DEPLOYMENT_USER: ${{ vars.SQL_DEPLOYMENT_USER }}
          SQL_PRIVATE_ENDPOINT_CIDR: ${{ vars.SQL_PRIVATE_ENDPOINT_CIDR }}
        run: |
          & ./package/scripts/Test-Readiness.ps1 `
            -ServerFqdn $env:SQL_SERVER_FQDN -Database $env:SQL_DATABASE_NAME `
            -ExpectedUser $env:SQL_DEPLOYMENT_USER -PrivateEndpointCidr $env:SQL_PRIVATE_ENDPOINT_CIDR
