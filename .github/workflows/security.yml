name: Publication checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CKV_DISABLE_METRICS: 'true'
      CHECKOV_DISABLE_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned local scanners
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/publication-tools"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$tools/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tools/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$tools/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tools/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          echo "$tools" >> "$GITHUB_PATH"
      - name: Scan complete Git history for secrets
        run: gitleaks git . --log-opts=--all --redact --no-banner
      - name: Validate all workflows
        run: actionlint
      - name: Compile infrastructure without Azure sign-in
        run: |
          mkdir -p "$RUNNER_TEMP/publication-infra"
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/publication-infra/main.json"
      - name: Install pinned infrastructure scanner
        run: |
          python3 -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/python" -m pip install --disable-pip-version-check \
            --index-url https://pypi.org/simple checkov==3.4.3
      - name: Check infrastructure against documented preview exceptions
        run: |
          "$RUNNER_TEMP/checkov/bin/checkov" --framework arm \
            --directory "$RUNNER_TEMP/publication-infra" \
            --baseline .checkov.baseline --output-baseline-as-skipped \
            --skip-download --skip-results-upload --compact \
            --output cli --output json \
            --output-file-path "console,$RUNNER_TEMP/checkov.json"
          jq -e '.summary.resource_count > 0 and .summary.parsing_errors == 0' "$RUNNER_TEMP/checkov.json"
          {
            echo '### Infrastructure policy boundary'
            echo 'Known starter findings are resource-specific preview exceptions, not a clean raw security scan. See SECURITY.md.'
            jq -r '.summary | "- Resource expressions scanned: \(.resource_count)\n- Baselined findings shown as skipped: \(.skipped)\n- New failed checks: \(.failed)"' "$RUNNER_TEMP/checkov.json"
          } >> "$GITHUB_STEP_SUMMARY"
